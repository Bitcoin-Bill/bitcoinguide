services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./bitcoin-guide complete:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  web_node_modules:
